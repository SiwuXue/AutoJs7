name: Android CI and Release

on:
  push:
    branches: [master]
    tags: ['v*-mcp.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o cmake-3.10.2.sh https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2.sh
          sudo ./cmake-3.10.2.sh --skip-license --prefix=/usr/local
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:packageAppDebug :app:testAppDebugUnitTest --no-daemon
      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-arm64-apk
          path: app/build/outputs/apk/app/debug/*-arm64-v8a.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AUTOJS_SIGNING_STORE_PASSWORD: ${{ secrets.AUTOJS_SIGNING_STORE_PASSWORD }}
      AUTOJS_SIGNING_KEY_ALIAS: ${{ secrets.AUTOJS_SIGNING_KEY_ALIAS }}
      AUTOJS_SIGNING_KEY_PASSWORD: ${{ secrets.AUTOJS_SIGNING_KEY_PASSWORD }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.AUTOJS_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate tag and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test "$GITHUB_REF_NAME" = "v${version_name}" || { echo 'Tag and VERSION_NAME differ'; exit 1; }
          for name in AUTOJS_SIGNING_STORE_PASSWORD AUTOJS_SIGNING_KEY_ALIAS AUTOJS_SIGNING_KEY_PASSWORD SIGNING_KEYSTORE_BASE64; do
            test -n "${!name}" || { echo "Missing secret: ${name}"; exit 1; }
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "AUTOJS_SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o cmake-3.10.2.sh https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2.sh
          sudo ./cmake-3.10.2.sh --skip-license --prefix=/usr/local
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          # ABI splitting is disabled whenever an Inrt assemble task is in the
          # same Gradle invocation, so build the two flavors separately.
          ./gradlew :app:assembleInrtRelease --no-daemon
          ./gradlew :app:assembleAppRelease --no-daemon
      - name: Verify APK signatures and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/app/release/*-arm64-v8a.apk
                app/build/outputs/apk/app/release/*-armeabi-v7a.apk
                app/build/outputs/apk/app/release/*-universal.apk)
          find app/build/outputs/apk/app/release -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
          test "${#apks[@]}" -eq 3 || { echo 'Expected arm64, armv7, and universal APKs'; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" && test -x "$apksigner" || { echo 'Android apksigner is missing'; exit 1; }
          for apk in "${apks[@]}"; do "$apksigner" verify "$apk"; done
          for apk in "${apks[@]}"; do
            hash="$(sha256sum "$apk" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$apk")"
          done > SHA256SUMS.txt
          printf '%s\n' "${apks[@]}" > release-assets.txt
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: |
            app/build/outputs/apk/app/release/*-arm64-v8a.apk
            app/build/outputs/apk/app/release/*-armeabi-v7a.apk
            app/build/outputs/apk/app/release/*-universal.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < release-assets.txt
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apks[@]}" SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${apks[@]}" SHA256SUMS.txt \
              --verify-tag --title "AutoJs6 ${GITHUB_REF_NAME} MCP 定制版" --notes-file "$notes"
          fi
